<style>
  :root{
    --ink:#151922;
    --panel:#1c2230;
    --panel-2:#232b3c;
    --line:#2f3a4f;
    --paper:#f7f5ef;
    --paper-ink:#1a1d24;
    --sub:#8b97ad;
    --accent:#00c2a8;
    --accent-dim:#0a7a6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Segoe UI",system-ui,sans-serif;
    background:var(--ink);
    color:#e7ecf5;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  header.top{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
  header.top h1{font-size:1.35rem;font-weight:700;letter-spacing:.02em}
  header.top .tag{
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:.72rem;color:var(--accent);border:1px solid var(--accent-dim);
    padding:2px 8px;border-radius:999px;letter-spacing:.05em;
  }
  header.top p{width:100%;color:var(--sub);font-size:.85rem;margin-top:2px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  /* form */
  .form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .form h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--sub);margin-bottom:16px;font-weight:600}
  .modeRow{display:flex;gap:8px;margin-bottom:16px}
  .seg{flex:1;position:relative;cursor:pointer}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;text-align:center;font-size:.76rem;padding:9px 6px;border:1px solid var(--line);border-radius:9px;color:var(--sub);transition:.15s;line-height:1.3}
  .seg input:checked + span{border-color:var(--accent);color:#eaf7f4;background:rgba(0,194,168,.12)}
  .seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  .logoField{display:flex;align-items:center;gap:12px}
  .logoThumb{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#232b3c;border:1px solid #2f3a4f;flex-shrink:0}
  .logoThumb[hidden]{display:none}
  .fileBtn{display:inline-block;font-size:.82rem;font-weight:600;cursor:pointer;border-radius:9px;padding:8px 14px;border:1px solid #2f3a4f;background:#232b3c;color:#e7ecf5}
  .fileBtn:hover{border-color:#00c2a8}
  .btnSmall{padding:8px 12px;font-size:.8rem}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.74rem;color:var(--sub);margin-bottom:5px;letter-spacing:.03em}
  .field input,.field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    color:#eef2f9;padding:10px 12px;font-size:.92rem;font-family:inherit;transition:border-color .15s;
  }
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:60px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.row{grid-template-columns:1fr}.field input,.field textarea{font-size:16px}}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  button{
    font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;
    border-radius:9px;padding:10px 16px;border:1px solid var(--line);
    background:var(--panel-2);color:#e7ecf5;transition:.15s;
  }
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#05231f;border-color:var(--accent)}
  button.primary:hover{background:#12d4b9}
  button.ghost{background:transparent}

  /* preview */
  .previewCol{display:flex;flex-direction:column;gap:18px}
  .card{
    background:#fffdf8;color:#20242c;border-radius:9px;
    padding:22px 24px;position:relative;overflow:hidden;
    box-shadow:0 20px 44px -20px rgba(0,0,0,.65);
    border:1px solid #e7e2d6;
    aspect-ratio:91/55;min-height:250px;
    display:flex;flex-direction:column;
    font-feature-settings:"palt";
  }
  .card .brand{display:flex;gap:13px;align-items:flex-start}
  .card .logo{width:50px;height:50px;object-fit:contain;flex-shrink:0}
  .card .logo[hidden]{display:none}
  .card .brandText{min-width:0}
  .card .brand .org{font-size:.92rem;font-weight:600;letter-spacing:.05em;color:#2b2f38;line-height:1.3}
  .card .brand .org.empty{color:#c8c2b4}
  .card .orgRule{height:2px;width:34px;background:var(--accent);margin-top:7px;border-radius:2px}
  .card .tagline{font-size:.68rem;color:#8a8577;margin-top:7px;letter-spacing:.03em;line-height:1.4}
  .card .middle{flex:1;display:flex;align-items:center;gap:16px}
  .card .nameBlock{flex:1;min-width:0}
  .card .title{font-size:.7rem;color:#6b7280;letter-spacing:.1em;margin-bottom:3px}
  .card .name{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:1.7rem;font-weight:600;letter-spacing:.08em;line-height:1.2;
  }
  .card .name.empty{color:#c8c2b4;font-weight:500}
  .card .qr{background:#fff;padding:5px;border:1px solid #ece7db;border-radius:6px;flex-shrink:0}
  .card .qr canvas{display:block;width:82px;height:82px}
  .card .foot{border-top:1px solid #e7e2d6;padding-top:10px;display:grid;gap:3px}
  .card .foot div{display:flex;gap:12px;font-size:.72rem;color:#3d434e;align-items:baseline}
  .card .foot .lbl{
    color:var(--accent-dim);font-weight:700;min-width:36px;
    letter-spacing:.06em;font-size:.62rem;flex-shrink:0;
  }
  .card .foot .val{word-break:break-all}

  .hint{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;font-size:.8rem;color:var(--sub);
  }
  .scanBox{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px;display:flex;gap:16px;align-items:center;
  }
  .scanBox .qrBigWrap{background:#fff;padding:12px;border-radius:10px;flex-shrink:0}
  .scanBox .qrBigWrap canvas{display:block;width:150px;height:150px}
  .scanBox .scanText b{color:#e7ecf5;font-weight:600;display:block;margin-bottom:4px}
  .scanBox .scanText{font-size:.8rem;color:var(--sub)}
  .hint b{color:#e7ecf5;font-weight:600}
  .hint ol{margin:8px 0 0 18px;display:grid;gap:4px}

let logoData = DEFAULT_LOGO;
const ids = ["name","org","title","tel","email","url","adr","note"];
const el = id => document.getElementById(id);
// --- QR drawing via inlined qrcode-generator (no CDN) ---
function drawQR(canvas, text, targetPx, marginMods){
  const ctx = canvas.getContext("2d");
  if(!text || text.trim() === ""){
    canvas.width = canvas.height = targetPx;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,targetPx,targetPx);
    return;
  }
  const q = qrcode(0, "M");
  q.addData(text);
  q.make();
  const count = q.getModuleCount();
  const total = count + marginMods*2;
  const cell = Math.max(1, Math.floor(targetPx/total));
  const size = cell*total;
  canvas.width = canvas.height = size;
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,size,size);
  ctx.fillStyle = "#151922";
  for(let r=0;r<count;r++) for(let c=0;c<count;c++)
    if(q.isDark(r,c)) ctx.fillRect((c+marginMods)*cell,(r+marginMods)*cell,cell,cell);
}
let savedTimer;

function collect(){
  const d = {};
  ids.forEach(k => d[k] = el("f_"+k).value.trim());
  return d;
}

function esc(v){ return (v||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }

function buildVCard(d){
  // 姓名は空白で分割（なければFNのみ）
  const parts = d.name.split(/[\s　]+/).filter(Boolean);
  const last = parts.length > 1 ? parts[0] : "";
  const first = parts.length > 1 ? parts.slice(1).join(" ") : d.name;
  const lines = ["BEGIN:VCARD","VERSION:3.0"];
  lines.push(`N:${esc(last)};${esc(first)};;;`);
  if(d.name)  lines.push(`FN:${esc(d.name)}`);
  if(d.org)   lines.push(`ORG:${esc(d.org)}`);
  if(d.title) lines.push(`TITLE:${esc(d.title)}`);
  if(d.tel)   lines.push(`TEL;TYPE=CELL:${esc(d.tel)}`);
  if(d.email) lines.push(`EMAIL;TYPE=INTERNET:${esc(d.email)}`);
  if(d.url)   lines.push(`URL:${esc(d.url)}`);
  if(d.adr)   lines.push(`ADR;TYPE=WORK:;;${esc(d.adr)};;;;`);
  if(d.note)  lines.push(`NOTE:${esc(d.note)}`);
  lines.push("END:VCARD");
  return lines.join("\r\n");
}

function render(){
  const d = collect();
  // preview
  const logoEl = el("c_logo"), thumbEl = el("logoPreview");
  if(logoData){ logoEl.src = logoData; logoEl.hidden = false; thumbEl.src = logoData; thumbEl.hidden = false; }
  else { logoEl.removeAttribute("src"); logoEl.hidden = true; thumbEl.removeAttribute("src"); thumbEl.hidden = true; }
  el("c_org").textContent = d.org || "会社 / 屋号";
  el("c_org").classList.toggle("empty", !d.org);
  el("c_name").textContent = d.name || "お名前";
  el("c_name").classList.toggle("empty", !d.name);
  el("c_title").textContent = d.title || "";
  el("c_note").textContent = d.note || "";
  const c = el("c_contact");
  c.innerHTML = "";
  const row = (k,v) => { if(v){ const r=document.createElement("div"); r.innerHTML=`<span class="lbl">${k}</span><span class="val">${v.replace(/</g,"&lt;")}</span>`; c.appendChild(r);} };
  row("TEL", d.tel);
  row("MAIL", d.email);
  row("WEB", d.url);
  row("〒", d.adr);
  // qr
  const hasData = ids.some(k => d[k]);
  const mode = document.querySelector('input[name=mode]:checked').value;
  el("urlModeField").style.display = mode === "url" ? "block" : "none";
  let payload;
  if(mode === "url"){
    payload = el("f_vcfurl").value.trim() || " ";
    el("scanNote").textContent = "このQRを読むと、名刺ページ（さっきの画面）がそのまま開きます。";
  } else {
    payload = hasData ? buildVCard(d) : " ";
    el("scanNote").textContent = "このQRは連絡先の追加だけ。名刺画面は出ません（画面を出すにはURLモードへ）。";
  }
  const drawText = payload.trim() === "" ? "" : payload;
  drawQR(el("qr"), drawText, 320, 4);
  drawQR(el("qrBig"), drawText, 600, 4);
  // save
  localStorage.setItem(KEY, JSON.stringify({...d, _mode:mode, _vcfurl:el("f_vcfurl").value.trim(), _logo:logoData}));
  clearTimeout(savedTimer);
  el("saved").style.opacity = 1;
  savedTimer = setTimeout(()=> el("saved").style.opacity = 0, 1200);
}

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY) || "{}");
    ids.forEach(k => { if(d[k]) el("f_"+k).value = d[k]; });
    if(d._vcfurl) el("f_vcfurl").value = d._vcfurl;
    if(d._mode){ const r = document.querySelector(`input[name=mode][value="${d._mode}"]`); if(r) r.checked = true; }
    if(Object.prototype.hasOwnProperty.call(d, "_logo")) logoData = d._logo;
  }catch(e){}
  render();
}

function loadLogoFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 200, scale = Math.min(1, max/Math.max(img.width, img.height));
      const cw = Math.round(img.width*scale), ch = Math.round(img.height*scale);
      const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
      cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
      logoData = cv.toDataURL("image/png");
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

el("f_logo").addEventListener("change", e => { if(e.target.files[0]) loadLogoFile(e.target.files[0]); e.target.value = ""; });
el("logoRemove").addEventListener("click", () => { logoData = ""; render(); });

ids.forEach(k => el("f_"+k).addEventListener("input", render));
el("f_vcfurl").addEventListener("input", render);
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener("change", render));


function roundRectPath(ctx, x, y, w, h, r){
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function fitText(ctx, text, maxWidth, startPx, minPx, weight, family){
  let px = startPx;
  while(px > minPx){
    ctx.font = `${weight} ${px}px ${family}`;
    if(ctx.measureText(text).width <= maxWidth) break;
    px -= 2;
  }
  return px;
}

function drawMultiline(ctx, text, x, y, lineHeight, maxLines){
  const lines = String(text || "").split(/\r?\n/).filter(Boolean).slice(0,maxLines);
  lines.forEach((line, i)=>ctx.fillText(line, x, y + i*lineHeight));
}

async function saveCanvasForIPhone(canvas, filename){
  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  if(blob){
    try{
      const file = new File([blob], filename, {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:"デジタル名刺"});
        return;
      }
    }catch(e){}
  }
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

el("saveCardImage").addEventListener("click", async ()=>{
  const d = collect();
  if(!ids.some(k => d[k])){
    alert("先に名刺の内容を入力してください");
    return;
  }

  // 名刺比率 91:55。高解像度PNGとして書き出す。
  const W = 1820, H = 1100;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");

  // 背景
  ctx.fillStyle = "#fffdf8";
  ctx.fillRect(0,0,W,H);

  // 外周のごく薄い枠
  ctx.strokeStyle = "#e7e2d6";
  ctx.lineWidth = 3;
  roundRectPath(ctx, 3,3,W-6,H-6,28);
  ctx.stroke();

  const left = 105;
  const top = 90;

  // ロゴ
  let logoBottom = top;
  if(logoData){
    try{
      const img = new Image();
      img.src = logoData;
      await img.decode();
      const box = 150;
      const scale = Math.min(box/img.width, box/img.height);
      const dw = img.width*scale, dh = img.height*scale;
      ctx.drawImage(img, left, top, dw, dh);
      logoBottom = top + dh;
    }catch(e){}
  }

  // 屋号
  const textX = 300;
  ctx.fillStyle = "#20242c";
  const org = d.org || "オフィスよしラボ";
  const orgPx = fitText(ctx, org, 780, 62, 38, 700, '"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif');
  ctx.font = `700 ${orgPx}px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif`;
  ctx.fillText(org, textX, 145);

  // アクセントライン
  ctx.fillStyle = "#00a995";
  ctx.fillRect(textX, 195, 130, 7);

  // 事業内容・ひとこと
  ctx.fillStyle = "#666b75";
  ctx.font = '34px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  drawMultiline(ctx, d.note || "", textX, 255, 48, 3);

  // 肩書き + 氏名
  const nameY = 610;
  ctx.fillStyle = "#6b7280";
  ctx.font = '30px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  ctx.fillText(d.title || "", left, nameY-80);

  ctx.fillStyle = "#20242c";
  const name = d.name || "お名前";
  const namePx = fitText(ctx, name, 850, 82, 48, 500, '"Hiragino Mincho ProN","Yu Mincho",serif');
  ctx.font = `500 ${namePx}px "Hiragino Mincho ProN","Yu Mincho",serif`;
  ctx.fillText(name, left, nameY);

  // QR
  const mode = document.querySelector('input[name=mode]:checked').value;
  const payload = mode === "url"
    ? el("f_vcfurl").value.trim()
    : buildVCard(d);
  if(payload){
    const qrCv = document.createElement("canvas");
    drawQR(qrCv, payload, 400, 4);
    const qrSize = 330;
    const qx = W - qrSize - 125;
    const qy = 430;
    ctx.fillStyle = "#ffffff";
    roundRectPath(ctx, qx-26, qy-26, qrSize+52, qrSize+52, 18);
    ctx.fill();
    ctx.strokeStyle = "#e7e2d6";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.drawImage(qrCv, qx, qy, qrSize, qrSize);
  }

  // 下部区切り線
  ctx.strokeStyle = "#dedbd2";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(left, 850);
  ctx.lineTo(W-left, 850);
  ctx.stroke();

  // 連絡先
  const contacts = [];
  if(d.adr) contacts.push(["〒", d.adr]);
  if(d.tel) contacts.push(["TEL", d.tel]);
  if(d.email) contacts.push(["MAIL", d.email]);
  if(d.url) contacts.push(["WEB", d.url]);

  let cy = 915;
  contacts.slice(0,3).forEach(([k,v])=>{
    ctx.fillStyle = "#0a7a6b";
    ctx.font = '700 24px "Segoe UI","Yu Gothic",sans-serif';
    ctx.fillText(k, left, cy);
    ctx.fillStyle = "#4a4f58";
    ctx.font = '28px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
    const shown = v.length > 60 ? v.slice(0,57)+"…" : v;
    ctx.fillText(shown, left+115, cy);
    cy += 52;
  });

  await saveCanvasForIPhone(cv, (d.name || "meishi") + "_名刺.png");
});


el("dlQr").addEventListener("click", ()=>{

  const mode = document.querySelector('input[name=mode]:checked').value;

  a.click();
});

el("dlVcf").addEventListener("click", ()=>{
  const d = collect();
  if(!ids.some(k => d[k])){ alert("先に内容を入力してください"); return; }
  const blob = new Blob([buildVCard(d)], {type:"text/vcard;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (d.name || "meishi") + ".vcf";
  a.click();
  URL.revokeObjectURL(a.href);
});


function htmlEsc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

function qrPngDataUrl(text, px){
  const cv = document.createElement("canvas");
  drawQR(cv, text, px, 4);
  return cv.toDataURL("image/png");
}

function buildCardPage(d){

  const vcf = buildVCard(d);
  const qrimg = qrPngDataUrl(vcf, 320);
  const rows = [];
  if(d.tel)   rows.push('<a class="row" href="tel:'+h(d.tel.replace(/[^0-9+]/g,""))+'"><span class="k">TEL</span><span class="v">'+h(d.tel)+'</span></a>');
  if(d.email) rows.push('<a class="row" href="mailto:'+h(d.email)+'"><span class="k">MAIL</span><span class="v">'+h(d.email)+'</span></a>');
  if(d.url)   rows.push('<a class="row" href="'+h(d.url)+'" target="_blank" rel="noopener"><span class="k">WEB</span><span class="v">'+h(d.url)+'</span></a>');

  const P = [];
  P.push('<!DOCTYPE html><html lang="ja"><head>');
  P.push('<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">');

  P.push('*{margin:0;padding:0;box-sizing:border-box}');
  P.push('body{min-height:100vh;background:#12161c;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}');
  P.push('.card{width:100%;max-width:430px;background:#fffdf8;color:#20242c;border-radius:16px;padding:26px 26px 22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);font-feature-settings:"palt"}');
  P.push('.brand{display:flex;gap:14px;align-items:flex-start}');
  P.push('.brand .logo{width:60px;height:60px;object-fit:contain;flex-shrink:0}');
  P.push('.brand .bt{min-width:0}');
  P.push('.org{font-size:1.05rem;font-weight:600;letter-spacing:.04em;color:#2b2f38;line-height:1.3}');
  P.push('.rule{height:3px;width:38px;background:#00c2a8;border-radius:2px;margin-top:7px}');
  P.push('.tag{font-size:.74rem;color:#8a8577;margin-top:8px;line-height:1.5}');
  P.push('.mid{display:flex;align-items:center;gap:16px;margin:22px 0}');
  P.push('.nameBlock{flex:1;min-width:0}');
  P.push('.title{font-size:.74rem;color:#6b7280;letter-spacing:.1em;margin-bottom:4px}');
  P.push('.name{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:1.9rem;font-weight:600;letter-spacing:.09em;line-height:1.2}');
  P.push('.qr{width:92px;height:92px;flex-shrink:0;background:#fff;border:1px solid #ece7db;border-radius:8px;padding:5px}');
  P.push('.foot{border-top:1px solid #e7e2d6;padding-top:6px}');
  P.push('.row{display:flex;gap:12px;align-items:baseline;padding:9px 2px;border-bottom:1px solid #f0ece1;text-decoration:none;color:#20242c}');
  P.push('.row:last-child{border-bottom:none}');
  P.push('.row .k{font-size:.62rem;font-weight:700;color:#0a7a6b;letter-spacing:.06em;min-width:38px;flex-shrink:0}');
  P.push('.row .v{font-size:.86rem;word-break:break-all}');
  P.push('a.row:active{background:#f5f2ea}');
  P.push('.add{display:block;width:100%;margin-top:18px;padding:15px;border:none;border-radius:12px;background:#00c2a8;color:#05231f;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}');
  P.push('.add:active{background:#0aa892}');
  P.push('</style></head><body>');
  P.push('<main class="card">');
  P.push('<div class="brand">');
  if(logoData){ P.push('<img class="logo" src="'+logoData+'" alt="">'); }
